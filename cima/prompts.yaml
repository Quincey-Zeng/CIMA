# prompts.yaml — 所有静态 system prompt 的集中维护文件
# 动态内容（样本、few-shot 示例、因子定义、待判断文本等）由 Python builder 在 user/content 中注入

system:
  classify: |-
    任务：判断给定文本是否为推广内容。

    标签定义：
    - "推广"指内容发布者通过文本，直接或间接引导用户从当前内容场景转移至其他沟通渠道、平台或服务入口，以建立进一步联系或完成业务转化的行为。
    - "正常"指正常的用户讨论，或者非推广文本。

    输出要求：
    - 只输出一个 JSON 对象，不要输出任何其他内容。
    - JSON 格式必须为：{"reasoning": "你的判断理由", "is_leadgen": true或false}
    - 其中 is_leadgen 为 true 表示推广，false 表示正常。

  propose: |-
    背景说明：
    - 这些文本来自中文网络论坛的评论。
    - "推广"指内容发布者通过文本，直接或间接引导用户从当前内容场景转移至其他沟通渠道、平台或服务入口，以建立进一步联系或完成业务转化的行为。
    - 标签"正常"指正常的用户讨论，或者非推广文本。

    任务：根据给定的已标注文本样本，抽象出能够区分"推广"和"正常"的高层因子。

    分析要求：
    - 你需要抽象、识别并设计合适的因子及对应的评判标准。
    - 每个候选因子都应有助于区分两个分组，并聚焦于一个具体方面，尽量避免重叠。
    - 每个因子的取值范围必须为 [-1, 0, 1]。
    - 你必须为每个因子的每个取值给出具体的评判标准。
    - 取值为 0 的标准统一写为"其他情况；或未提及"。

    重要约束：
    - 因子应面向推广（正样本）方向定义：取值 1 表示该因子呈现推广文本的特征，取值 -1 表示呈现正常文本的特征。
    - 因子应提取推广的本质特征，而非仅提取样本表面表现。

    输出要求：
    - 只输出一个 JSON 对象，不要输出任何其他内容。
    - JSON 格式必须为：
      {
        "thinking": "你的思考过程",
        "filtering": "因子筛选过程",
        "factors": [
          {
            "name": "因子名称",
            "criteria_pos": "取值1的评判标准（呈现推广特征）",
            "criteria_zero": "其他情况；或未提及",
            "criteria_neg": "取值-1的评判标准（呈现正常/非推广特征）"
          }
        ]
      }

  annotate: |-
    任务：根据给定因子及其评判标准，对单条文本进行离散赋值。

    输出要求：
    - 只输出一个 JSON 对象，不要输出任何其他内容。
    - JSON 格式必须为：{"reasoning": "你的判断理由", "value": X}
    - 其中 value 只能是 -1、0 或 1。

  explain: |-
    背景说明：
    - 这些文本来自中文网络论坛的评论。
    - "推广"指内容发布者通过文本，直接或间接引导用户从当前内容场景转移至其他沟通渠道、平台或服务入口，以建立进一步联系或完成业务转化的行为。
    - 标签"正常"指正常的用户讨论，或者非推广文本。

    任务：基于给定因果因子，解释文本为什么属于指定标签。需要综合各因子的语义方向，从整体意图层面给出抽象判断。

    输出要求：
    - 只输出一个 JSON 对象，不要输出任何其他内容。
    - JSON 格式必须为：{"reasoning": "你的80-150字简洁分析理由，综合因子信号对文本整体意图作出抽象概括"}
